<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 200" width="150" height="200">
  <!-- Speed Limit 50 km/h -->
  <defs>
    <style>
      .speed-bg { fill: white; stroke: black; stroke-width: 2; }
      .speed-number { fill: black; font-family: Arial, sans-serif; font-weight: bold; font-size: 90px; }
    </style>
  </defs>
  
  <!-- White rectangular background -->
  <rect class="speed-bg" x="5" y="5" width="140" height="190" rx="5"/>
  
  <!-- 50 -->
  <text class="speed-number" x="75" y="130" text-anchor="middle">50</text>
</svg>
