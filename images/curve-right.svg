<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Curve Warning -->
  <defs>
    <style>
      .warning-diamond { fill: #FFC20E; stroke: black; stroke-width: 3; }
      .curve-arrow { fill: none; stroke: black; stroke-width: 10; stroke-linecap: round; }
    </style>
  </defs>
  
  <!-- Yellow diamond -->
  <rect class="warning-diamond" x="20" y="20" width="160" height="160" rx="5" transform="rotate(45 100 100)"/>
  
  <!-- Curved arrow (right curve) -->
  <path class="curve-arrow" d="M 60,100 Q 100,60 140,100" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0,2 5,5 0,8" fill="black"/>
    </marker>
  </defs>
  <polygon points="135,95 145,100 135,105" fill="black"/>
</svg>
