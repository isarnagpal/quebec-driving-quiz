<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Animal Crossing Warning (Deer/Moose) -->
  <defs>
    <style>
      .warning-diamond { fill: #FFC20E; stroke: black; stroke-width: 3; }
      .animal { fill: black; }
    </style>
  </defs>
  
  <!-- Yellow diamond -->
  <rect class="warning-diamond" x="20" y="20" width="160" height="160" rx="5" transform="rotate(45 100 100)"/>
  
  <!-- Simplified deer/moose silhouette -->
  <g class="animal">
    <!-- Body -->
    <ellipse cx="110" cy="115" rx="25" ry="18"/>
    <!-- Neck/head -->
    <ellipse cx="85" cy="95" rx="12" ry="18" transform="rotate(-30 85 95)"/>
    <!-- Head -->
    <circle cx="75" cy="80" r="10"/>
    <!-- Antlers -->
    <path d="M 70,75 L 65,65 M 70,75 L 75,65 M 80,75 L 85,65 M 80,75 L 75,65" stroke="black" stroke-width="3" fill="none"/>
    <!-- Legs -->
    <line x1="95" y1="125" x2="95" y2="145" stroke="black" stroke-width="4"/>
    <line x1="110" y1="125" x2="110" y2="145" stroke="black" stroke-width="4"/>
    <line x1="120" y1="125" x2="120" y2="145" stroke="black" stroke-width="4"/>
    <line x1="130" y1="125" x2="130" y2="145" stroke="black" stroke-width="4"/>
  </g>
</svg>
